id = "minlang"
name = "minlang"
description = "minlang support: syntax highlighting, and the minlang language server for errors, hover, go-to-definition and more."
version = "0.1.0"
schema_version = 1
authors = ["minlang contributors"]
repository = "https://github.com/nathantodd-devel/minlang"

[language_servers.minlang]
name = "minlang"
languages = ["minlang"]

# The tree-sitter grammar lives in this repository. Zed builds it from a
# commit, so `rev` must name a commit that contains it. For a local checkout,
# set `repository` to `file:///path/to/minlang`.
[grammars.minlang]
repository = "https://github.com/nathantodd-devel/minlang"
rev = "main"
path = "editors/tree-sitter-minlang"
