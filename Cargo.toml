[package]
name = "minlang"
version = "0.1.0"
edition = "2024"

[dependencies]
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Builds the (not yet implemented) inkwell backend. When implementing it, add:
# inkwell = { version = "...", features = ["llvm21-1"], optional = true }
# and make this feature `["dep:inkwell"]`.
inkwell = []
